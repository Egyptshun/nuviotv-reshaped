// Nuvio RS / AutoSync fork build settings. Applied from the end of build.gradle.kts, so Nuvio's
// own build file carries a single line; the values set here replace Nuvio's defaults.

def readProperties = { String name ->
    def properties = new Properties()
    def file = rootProject.file(name)
    if (file.exists()) file.withInputStream { properties.load(it) }
    properties
}
def localProperties = readProperties("local.properties")
def devProperties = readProperties("local.dev.properties")
def resolveProperty = { String key, String fallback ->
    [devProperties, localProperties].collect { it.getProperty(key)?.trim() }.find { it } ?: fallback
}
def buildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def autoSyncFork = resolveProperty("AUTOSYNC_FORK", "false").toLowerCase() in ["1", "true", "yes", "on"]
def nuvioShieldBuild = resolveProperty("NUVIO_SHIELD_BUILD", "false").toLowerCase() in ["1", "true", "yes", "on"] ||
    "true".equalsIgnoreCase(providers.gradleProperty("NUVIO_SHIELD_BUILD").getOrNull())
// Releases also ship a universal "bridge" APK under the pre-rename id, so installs from before
// the rename update in place and then hand their settings to Nuvio RS.
def reshapedLegacyBridge = "true".equalsIgnoreCase(providers.gradleProperty("nuvio.reshaped.legacyBridge").getOrNull())

def defaults = android.defaultConfig
if (autoSyncFork) {
    if (nuvioShieldBuild) {
        defaults.applicationId = "com.egyptshun.nuvio.shield"
    } else {
        defaults.applicationId = reshapedLegacyBridge ? "com.nuviodebug.com" : "com.nuvioreshaped.tv"
    }
}
// On-device speech recognition for the audio subtitle sync fallback (sherpa-onnx, Apache-2.0).
// RESHAPED_GOOGLE_TV_CLIENT_ID / _SECRET secrets. Without them, sign-in shows as not set up.
defaults.buildConfigField("String", "RESHAPED_GOOGLE_TV_CLIENT_ID", buildConfigString(resolveProperty("RESHAPED_GOOGLE_TV_CLIENT_ID", "")))
defaults.buildConfigField("String", "RESHAPED_GOOGLE_TV_CLIENT_SECRET", buildConfigString(resolveProperty("RESHAPED_GOOGLE_TV_CLIENT_SECRET", "")))
// In-app updater: the fork's own GitHub releases.
defaults.buildConfigField("String", "GITHUB_OWNER", buildConfigString(resolveProperty("NUVIO_UPDATE_GITHUB_OWNER", "NuvioMedia")))
defaults.buildConfigField("String", "GITHUB_REPO", buildConfigString(resolveProperty("NUVIO_UPDATE_GITHUB_REPO", "NuvioTV")))
defaults.buildConfigField("boolean", "AUTOSYNC_FORK", autoSyncFork.toString())

// The "Nuvio RS" app name for every locale; Shield builds use "Nuvio Shield"; the legacy bridge keeps the old name.
if (autoSyncFork && nuvioShieldBuild) {
    android.sourceSets.getByName("full").res.srcDir("src/shield/res")
} else if (autoSyncFork && !reshapedLegacyBridge) {
    android.sourceSets.getByName("full").res.srcDir("src/reshaped/res")
}

if (nuvioShieldBuild) {
    // Sideload channel: installs next to Nuvio RS; updates come from GitHub releases you publish manually.
    android.productFlavors.getByName("full").buildConfigField("boolean", "FEATURE_IN_APP_UPDATES_ENABLED", "false")
}

// On-device speech recognition for the audio subtitle sync fallback (sherpa-onnx, Apache-2.0).
// The AAR is ~50 MB, so it is downloaded once into libs/ (git-ignored) and verified instead of
// committed.
def sherpaOnnxVersion = "1.13.8"
def sherpaOnnxSha256 = "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96"
def sherpaOnnxAar = project.file("libs/sherpa-onnx-${sherpaOnnxVersion}.aar")
def sha256 = { File file -> java.security.MessageDigest.getInstance("SHA-256").digest(file.bytes).encodeHex().toString() }
if (!(sherpaOnnxAar.isFile() && sha256(sherpaOnnxAar) == sherpaOnnxSha256)) {
    def url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${sherpaOnnxVersion}/sherpa-onnx-${sherpaOnnxVersion}.aar"
    logger.lifecycle("Downloading $url")
    def partial = new File(sherpaOnnxAar.path + ".part")
    new URL(url).withInputStream { input -> partial.withOutputStream { it << input } }
    if (sha256(partial) != sherpaOnnxSha256) throw new GradleException("Checksum mismatch for $url")
    partial.renameTo(sherpaOnnxAar)
}
// sherpa-onnx's JNI library only needs libonnxruntime; its C/C++ API libraries are unused.
android.packaging.jniLibs.excludes.addAll(["lib/*/libsherpa-onnx-c-api.so", "lib/*/libsherpa-onnx-cxx-api.so"])
android.buildTypes.configureEach { it.proguardFile("reshaped-proguard-rules.pro") }

dependencies {
    implementation files(sherpaOnnxAar)
    // The audio sync tests use kotlin.test.
    testImplementation "org.jetbrains.kotlin:kotlin-test:${kotlin.coreLibrariesVersion}"
}
